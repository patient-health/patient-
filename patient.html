<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PACIENT+ | Bisedat e mia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .topbar {
      background: #0f172a;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.3);
      background: transparent;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .logout:hover {
      background: rgba(255,255,255,.1);
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .welcome p {
      margin: 0;
      color: #64748b;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .actions h2 {
      margin: 0;
      font-size: 21px;
    }

    .primary-btn {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary-btn:hover {
      background: #1d4ed8;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, .07);
      border: 1px solid #e5e7eb;
    }

    .form-card {
      display: none;
      margin-bottom: 25px;
    }

    .form-card.show {
      display: block;
    }

    .form-card h3 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 17px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
    }

    .secondary-btn {
      border: 1px solid #d1d5db;
      background: white;
      color: #334155;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .secondary-btn:hover {
      background: #f8fafc;
    }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .conversation {
      border: 1px solid #e2e8f0;
      border-radius: 11px;
      padding: 18px;
      margin-bottom: 12px;
      background: #fff;
    }

    .conversation:hover {
      border-color: #bfdbfe;
      background: #f8fbff;
    }

    .conversation-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .conversation-meta {
      color: #64748b;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.open {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status.answered {
      background: #dcfce7;
      color: #15803d;
    }

    .status.closed {
      background: #e5e7eb;
      color: #475569;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 35px 20px;
      color: #64748b;
    }

    @media (max-width: 700px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .user-area {
        width: 100%;
        justify-content: space-between;
      }

      .actions {
        align-items: flex-start;
        flex-direction: column;
      }

      .primary-btn {
        width: 100%;
      }

      .form-buttons {
        flex-direction: column;
      }

      .form-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">PACIENT+</div>

    <div class="user-area">
      <span id="userEmail">Po kontrollohet...</span>
      <button class="logout" id="logoutBtn">Dil</button>
    </div>
  </header>

  <main class="container">

    <section class="welcome">
      <h1>Mirë se vini 👋</h1>
      <p>Këtu mund të komunikoni me personelin shëndetësor.</p>
    </section>

    <div id="messageBox" class="message"></div>

    <section class="card form-card" id="newQuestionCard">

      <h3>💬 Krijo një pyetje të re</h3>

      <form id="questionForm">

        <label for="subject">Subjekti</label>

        <input
          type="text"
          id="subject"
          placeholder="P.sh. Pyetje për vizitën"
          required
        >

        <label for="question">Pyetja juaj</label>

        <textarea
          id="question"
          placeholder="Shkruani pyetjen tuaj këtu..."
          required
        ></textarea>

        <div class="form-buttons">

          <button
            type="submit"
            class="primary-btn"
            id="sendBtn"
          >
            Dërgo pyetjen
          </button>

          <button
            type="button"
            class="secondary-btn"
            id="cancelBtn"
          >
            Anulo
          </button>

        </div>

      </form>

    </section>

    <div class="actions">

      <h2>💬 Bisedat e mia</h2>

      <button
        class="primary-btn"
        id="newQuestionBtn"
      >
        + Pyetje e re
      </button>

    </div>

    <section class="card">

      <div id="conversationsList">
        <div class="loading">
          Po ngarkohen bisedat...
        </div>
      </div>

    </section>

  </main>

  <script>

    const SUPABASE_URL =
      "https://izrkvynsdikpevdhdtef.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_6eexQFM_g7BCaLK9V_DuZQ_oxwFbmSK";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    // E bëjmë të disponueshëm edhe në Console
    window.client = client;

    let currentUser = null;

    const userEmail =
      document.getElementById("userEmail");

    const conversationsList =
      document.getElementById("conversationsList");

    const newQuestionBtn =
      document.getElementById("newQuestionBtn");

    const newQuestionCard =
      document.getElementById("newQuestionCard");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const questionForm =
      document.getElementById("questionForm");

    const sendBtn =
      document.getElementById("sendBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const messageBox =
      document.getElementById("messageBox");


    function showMessage(text, type = "error") {

      messageBox.textContent = text;

      messageBox.className =
        "message show " + type;

    }


    function hideMessage() {

      messageBox.className = "message";

      messageBox.textContent = "";

    }


    newQuestionBtn.addEventListener("click", () => {

      hideMessage();

      newQuestionCard.classList.add("show");

      document
        .getElementById("subject")
        .focus();

    });


    cancelBtn.addEventListener("click", () => {

      newQuestionCard.classList.remove("show");

      questionForm.reset();

      hideMessage();

    });


    logoutBtn.addEventListener("click", async () => {

      await client.auth.signOut();

      window.location.href = "index.html";

    });


    async function loadUser() {

      const {
        data,
        error
      } = await client.auth.getUser();

      if (error || !data.user) {

        window.location.href = "index.html";

        return;

      }

      currentUser = data.user;

      userEmail.textContent =
        currentUser.email || "";

      console.log(
        "PACIENT+ USER ID:",
        currentUser.id
      );

      console.log(
        "PACIENT+ USER EMAIL:",
        currentUser.email
      );

      await loadConversations();

    }


    async function loadConversations() {

      conversationsList.innerHTML = `
        <div class="loading">
          Po ngarkohen bisedat...
        </div>
      `;

      const {
        data,
        error
      } = await client
        .from("conversations")
        .select("*")
        .eq("patient_id", currentUser.id)
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(
          "LOAD CONVERSATIONS ERROR:",
          error
        );

        conversationsList.innerHTML = `
          <div class="empty">
            Nuk u ngarkuan bisedat.
          </div>
        `;

        return;

      }

      if (!data || data.length === 0) {

        conversationsList.innerHTML = `
          <div class="empty">
            Nuk keni ende biseda.
            <br><br>
            Klikoni <strong>+ Pyetje e re</strong>
            për të filluar.
          </div>
        `;

        return;

      }

      conversationsList.innerHTML = "";

      data.forEach(conversation => {

        const item =
          document.createElement("div");

        item.className = "conversation";

        const status =
          conversation.status || "open";

        const statusText =
          status === "answered"
            ? "Përgjigjur"
            : status === "closed"
              ? "Mbyllur"
              : "Hapur";

        const date =
          conversation.created_at
            ? new Date(
                conversation.created_at
              ).toLocaleString("sq-AL")
            : "";

        item.innerHTML = `
          <div class="conversation-title">
            ${escapeHtml(
              conversation.subject ||
              "Pa subjekt"
            )}
          </div>

          <div class="conversation-meta">

            <span>
              ${date}
            </span>

            <span class="status ${status}">
              ${statusText}
            </span>

          </div>
        `;

        conversationsList.appendChild(item);

      });

    }


    questionForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideMessage();

        if (!currentUser) {

          showMessage(
            "Përdoruesi nuk është identifikuar."
          );

          return;

        }

        const subject =
          document
            .getElementById("subject")
            .value
            .trim();

        const question =
          document
            .getElementById("question")
            .value
            .trim();

        if (!subject || !question) {

          showMessage(
            "Plotësoni subjektin dhe pyetjen."
          );

          return;

        }

        sendBtn.disabled = true;

        sendBtn.textContent =
          "Po dërgohet...";

        console.log(
          "Creating conversation with patient_id:",
          currentUser.id
        );

        try {

          // 1. Krijojmë bisedën
          const {
            data: conversation,
            error: conversationError
          } = await client
            .from("conversations")
            .insert({
              patient_id: currentUser.id,
              subject: subject,
              status: "open"
            })
            .select()
            .single();

          if (conversationError) {

            console.error(
              "CONVERSATION ERROR:",
              conversationError
            );

            throw new Error(
              conversationError.message
            );

          }

          console.log(
            "Conversation created:",
            conversation
          );


          // 2. Krijojmë mesazhin e parë
          const {
            data: message,
            error: messageError
          } = await client
            .from("messages")
            .insert({
              conversation_id:
                conversation.id,

              sender_id:
                currentUser.id,

              message:
                question
            })
            .select()
            .single();


          if (messageError) {

            console.error(
              "MESSAGE ERROR:",
              messageError
            );

            throw new Error(
              messageError.message
            );

          }

          console.log(
            "Message created:",
            message
          );


          // 3. Pastrojmë formularin
          questionForm.reset();

          newQuestionCard.classList.remove(
            "show"
          );

          showMessage(
            "Pyetja u dërgua me sukses. ❤️",
            "success"
          );

          await loadConversations();

        } catch (error) {

          console.error(
            "CREATE QUESTION ERROR:",
            error
          );

          showMessage(
            "Pyetja nuk u krijua: " +
            error.message
          );

        } finally {

          sendBtn.disabled = false;

          sendBtn.textContent =
            "Dërgo pyetjen";

        }

      }
    );


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    // Nisja
    loadUser();

  </script>

</body>
</html>
