<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PACIENT+ | Paneli i pacientit</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(30, 190, 215, 0.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #06131d,
          #0a202d 55%,
          #07151f
        );

      color: #eefaff;
    }

    .topbar {
      height: 74px;
      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid rgba(120, 210, 225, 0.12);

      background: rgba(5, 20, 30, 0.85);

      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      background:
        linear-gradient(
          135deg,
          #19c4d8,
          #1679b6
        );
    }

    .brand-name {
      font-size: 24px;
      font-weight: 900;
    }

    .brand-name span {
      color: #57dcea;
    }

    .logout {
      border: 1px solid #294655;
      background: #0c2535;
      color: #cde4ec;

      padding: 10px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 700;
    }

    .logout:hover {
      border-color: #25bfd4;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 35px 24px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #8faebb;
      font-size: 15px;
    }

    .grid {
      display: grid;

      grid-template-columns: 1fr 340px;

      gap: 24px;
    }

    .card {
      background: rgba(10, 31, 45, 0.88);

      border: 1px solid rgba(105, 205, 225, 0.14);

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.20);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 22px;
    }

    .card-header h2 {
      font-size: 20px;
    }

    .new-button {
      border: 0;

      border-radius: 10px;

      padding: 11px 15px;

      background:
        linear-gradient(
          135deg,
          #59e0eb,
          #19afcf
        );

      color: #03131b;

      font-weight: 900;

      cursor: pointer;
    }

    .new-button:hover {
      filter: brightness(1.05);
    }

    .empty {
      text-align: center;

      padding: 55px 20px;

      color: #78939f;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .empty h3 {
      color: #c5dce4;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 14px;
      line-height: 1.6;
    }

    .profile {
      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .profile-icon {
      width: 70px;
      height: 70px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;

      background: rgba(30, 191, 213, 0.12);

      border: 1px solid rgba(50, 207, 224, 0.2);
    }

    .profile-label {
      color: #708995;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.8px;

      margin-bottom: 5px;
    }

    .profile-value {
      color: #dceef4;

      font-size: 14px;

      word-break: break-word;
    }

    .status {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      color: #71e3b4;

      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #4ed39e;

      box-shadow:
        0 0 10px rgba(78, 211, 158, 0.6);
    }

    /* FORM */

    .form-box {
      display: none;

      margin-bottom: 24px;

      padding: 22px;

      border-radius: 16px;

      background: #081d2b;

      border: 1px solid #294655;
    }

    .form-box.active {
      display: block;
    }

    .form-title {
      font-size: 19px;
      font-weight: 800;

      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      color: #bdd2dc;

      font-size: 13px;

      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;

      border: 1px solid #294655;

      border-radius: 11px;

      background: #0c2535;

      color: #f2fbff;

      padding: 12px 14px;

      outline: none;

      font-family: inherit;

      font-size: 14px;
    }

    .field input {
      height: 48px;
    }

    .field textarea {
      min-height: 130px;

      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #25bfd4;

      box-shadow:
        0 0 0 3px rgba(37, 191, 212, 0.10);
    }

    .form-buttons {
      display: flex;

      gap: 10px;

      margin-top: 18px;
    }

    .send-button,
    .cancel-button {
      border: 0;

      border-radius: 10px;

      padding: 12px 18px;

      cursor: pointer;

      font-weight: 800;
    }

    .send-button {
      background:
        linear-gradient(
          135deg,
          #59e0eb,
          #19afcf
        );

      color: #03131b;
    }

    .send-button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    .cancel-button {
      background: #142e3d;

      color: #b8d0da;

      border: 1px solid #294655;
    }

    /* CONVERSATION */

    .conversation-item {
      padding: 18px;

      margin-bottom: 12px;

      border-radius: 14px;

      background: #0c2535;

      border: 1px solid #294655;

      cursor: pointer;

      transition: 0.2s;
    }

    .conversation-item:hover {
      border-color: #25bfd4;

      transform: translateY(-1px);
    }

    .conversation-title {
      font-weight: 800;

      margin-bottom: 8px;

      color: #e6f7fb;
    }

    .conversation-meta {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      color: #78939f;

      font-size: 12px;
    }

    .badge {
      display: inline-block;

      padding: 4px 8px;

      border-radius: 7px;

      background: rgba(37, 191, 212, 0.10);

      color: #62dbe7;
    }

    .loading {
      text-align: center;

      padding: 40px;

      color: #7f9ca8;
    }

    .error {
      color: #ff9d9d;

      text-align: center;

      padding: 25px;

      line-height: 1.6;
    }

    .success {
      color: #71e3b4;

      font-size: 13px;

      margin-top: 12px;
    }

    @media (max-width: 850px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 18px;
      }

      .container {
        padding: 25px 15px;
      }
    }

    @media (max-width: 500px) {

      .brand-name {
        font-size: 21px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .card-header {
        align-items: flex-start;

        gap: 15px;

        flex-direction: column;
      }

      .new-button {
        width: 100%;
      }

      .form-buttons {
        flex-direction: column;
      }

      .send-button,
      .cancel-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        ✚
      </div>

      <div class="brand-name">
        PACIENT<span>+</span>
      </div>

    </div>

    <button
      class="logout"
      id="logoutButton"
    >
      Dil
    </button>

  </header>


  <!-- MAIN -->

  <main class="container">

    <section class="welcome">

      <h1>
        Mirë se vini 👋
      </h1>

      <p>
        Nga këtu mund të komunikoni me personelin shëndetësor.
      </p>

    </section>


    <section class="grid">

      <!-- LEFT -->

      <div class="card">

        <div class="card-header">

          <h2>
            💬 Bisedat e mia
          </h2>

          <button
            class="new-button"
            id="newConversationButton"
          >
            + Pyetje e re
          </button>

        </div>


        <!-- NEW QUESTION FORM -->

        <div
          class="form-box"
          id="newQuestionBox"
        >

          <div class="form-title">
            Krijo një pyetje të re
          </div>


          <div class="field">

            <label for="subject">
              Subjekti
            </label>

            <input
              type="text"
              id="subject"
              placeholder="P.sh. Pyetje për vizitën"
              maxlength="150"
            >

          </div>


          <div class="field">

            <label for="question">
              Mesazhi
            </label>

            <textarea
              id="question"
              placeholder="Shkruani pyetjen tuaj..."
            ></textarea>

          </div>


          <div class="form-buttons">

            <button
              class="send-button"
              id="sendButton"
            >
              Dërgo pyetjen
            </button>

            <button
              class="cancel-button"
              id="cancelButton"
              type="button"
            >
              Anulo
            </button>

          </div>


          <div
            id="formMessage"
            class="success"
          ></div>

        </div>


        <!-- CONVERSATIONS -->

        <div id="conversations">

          <div class="empty">

            <div class="empty-icon">
              💬
            </div>

            <h3>
              Nuk keni ende biseda
            </h3>

            <p>
              Krijoni pyetjen tuaj të parë për të komunikuar
              me personelin shëndetësor.
            </p>

          </div>

        </div>

      </div>


      <!-- PROFILE -->

      <aside class="card">

        <div class="profile">

          <div class="profile-icon">
            👤
          </div>


          <div>

            <div class="profile-label">
              Llogaria
            </div>

            <div
              class="profile-value"
              id="userEmail"
            >
              Po ngarkohet...
            </div>

          </div>


          <div>

            <div class="profile-label">
              Statusi
            </div>

            <div class="status">

              <span class="status-dot"></span>

              Aktiv

            </div>

          </div>

        </div>

      </aside>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>


  <script>

    "use strict";


    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://izrkvynsdikpevdhdtef.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_6eexQFM_g7BCaLK9V_DuZQ_oxwFbmSK";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const userEmail =
      document.getElementById("userEmail");

    const logoutButton =
      document.getElementById("logoutButton");

    const newConversationButton =
      document.getElementById(
        "newConversationButton"
      );

    const newQuestionBox =
      document.getElementById(
        "newQuestionBox"
      );

    const cancelButton =
      document.getElementById(
        "cancelButton"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const subjectInput =
      document.getElementById(
        "subject"
      );

    const questionInput =
      document.getElementById(
        "question"
      );

    const formMessage =
      document.getElementById(
        "formMessage"
      );

    const conversations =
      document.getElementById(
        "conversations"
      );


    let currentUser = null;


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================
       LOAD USER
    ===================================== */

    async function loadUser() {

      try {

        const result =
          await client.auth.getUser();


        if (
          result.error ||
          !result.data ||
          !result.data.user
        ) {

          window.location.href =
            "index.html";

          return;
        }


        currentUser =
          result.data.user;


        userEmail.textContent =
          currentUser.email;


        console.log(
          "PACIENT+ USER:",
          currentUser
        );


        await loadConversations();

      }

      catch (error) {

        console.error(
          "USER ERROR:",
          error
        );

        window.location.href =
          "index.html";

      }

    }


    /* =====================================
       LOAD CONVERSATIONS
    ===================================== */

    async function loadConversations() {

      if (!currentUser) {
        return;
      }


      conversations.innerHTML = `
        <div class="loading">
          Po ngarkohen bisedat...
        </div>
      `;


      try {

        const result =
          await client
            .from("conversations")
            .select("*")
            .eq(
              "patient_id",
              currentUser.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (result.error) {

          console.error(
            "CONVERSATIONS ERROR:",
            result.error
          );


          conversations.innerHTML = `
            <div class="error">
              Bisedat nuk mund të ngarkohen.
              <br><br>
              ${escapeHtml(
                result.error.message
              )}
            </div>
          `;

          return;
        }


        if (
          !result.data ||
          result.data.length === 0
        ) {

          conversations.innerHTML = `
            <div class="empty">

              <div class="empty-icon">
                💬
              </div>

              <h3>
                Nuk keni ende biseda
              </h3>

              <p>
                Krijoni pyetjen tuaj të parë
                për të komunikuar me personelin
                shëndetësor.
              </p>

            </div>
          `;

          return;
        }


        conversations.innerHTML = "";


        result.data.forEach(
          function(conversation) {

            const item =
              document.createElement(
                "div"
              );


            item.className =
              "conversation-item";


            const date =
              conversation.created_at
                ? new Date(
                    conversation.created_at
                  ).toLocaleString(
                    "sq-AL"
                  )
                : "";


            item.innerHTML = `

              <div class="conversation-title">
                ${escapeHtml(
                  conversation.subject ||
                  "Pa subjekt"
                )}
              </div>

              <div class="conversation-meta">

                <span>
                  ${escapeHtml(date)}
                </span>

                <span class="badge">
                  ${escapeHtml(
                    conversation.status ||
                    "open"
                  )}
                </span>

              </div>

            `;


            conversations.appendChild(
              item
            );

          }
        );

      }

      catch (error) {

        console.error(
          "LOAD ERROR:",
          error
        );


        conversations.innerHTML = `
          <div class="error">
            Ndodhi një gabim gjatë ngarkimit.
          </div>
        `;

      }

    }


    /* =====================================
       OPEN NEW QUESTION
    ===================================== */

    newConversationButton.addEventListener(
      "click",
      function() {

        newQuestionBox.classList.add(
          "active"
        );

        subjectInput.focus();

      }
    );


    /* =====================================
       CANCEL
    ===================================== */

    cancelButton.addEventListener(
      "click",
      function() {

        newQuestionBox.classList.remove(
          "active"
        );

        subjectInput.value = "";

        questionInput.value = "";

        formMessage.textContent = "";

      }
    );


    /* =====================================
       SEND QUESTION
    ===================================== */

    sendButton.addEventListener(
      "click",
      async function() {

        if (!currentUser) {

          formMessage.textContent =
            "Sesioni juaj nuk është aktiv.";

          return;
        }


        const subject =
          subjectInput.value.trim();


        const question =
          questionInput.value.trim();


        if (!subject) {

          formMessage.textContent =
            "Shkruani subjektin.";

          subjectInput.focus();

          return;
        }


        if (!question) {

          formMessage.textContent =
            "Shkruani pyetjen tuaj.";

          questionInput.focus();

          return;
        }


        sendButton.disabled = true;

        sendButton.textContent =
          "Po dërgohet...";

        formMessage.textContent = "";


        try {

          /*
            1. KRIJOJMË CONVERSATION
          */

          const conversationResult =
            await client
              .from("conversations")
              .insert({

                patient_id:
                  currentUser.id,

                subject:
                  subject,

                status:
                  "open"

              })
              .select()
              .single();


          if (
            conversationResult.error
          ) {

            console.error(
              "CREATE CONVERSATION ERROR:",
              conversationResult.error
            );


            formMessage.textContent =
              "Pyetja nuk u krijua: " +
              conversationResult.error.message;


            sendButton.disabled = false;

            sendButton.textContent =
              "Dërgo pyetjen";

            return;
          }


          const conversation =
            conversationResult.data;


          /*
            2. RUAJMË MESAZHIN E PARË
          */

          const messageResult =
            await client
              .from("messages")
              .insert({

                conversation_id:
                  conversation.id,

                sender_id:
                  currentUser.id,

                message:
                  question

              });


          if (
            messageResult.error
          ) {

            console.error(
              "CREATE MESSAGE ERROR:",
              messageResult.error
            );


            /*
              Nëse mesazhi nuk u ruajt,
              e njoftojmë përdoruesin.
            */

            formMessage.textContent =
              "Biseda u krijua, por mesazhi nuk u ruajt: " +
              messageResult.error.message;


            sendButton.disabled = false;

            sendButton.textContent =
              "Dërgo pyetjen";

            return;
          }


          /*
            3. SUKSES
          */

          formMessage.textContent =
            "Pyetja u dërgua me sukses ✓";


          subjectInput.value = "";

          questionInput.value = "";


          sendButton.textContent =
            "Dërguar ✓";


          /*
            Rifreskojmë listën.
          */

          await loadConversations();


          setTimeout(
            function() {

              newQuestionBox.classList.remove(
                "active"
              );

              sendButton.disabled = false;

              sendButton.textContent =
                "Dërgo pyetjen";

              formMessage.textContent = "";

            },
            1200
          );

        }

        catch (error) {

          console.error(
            "SEND QUESTION ERROR:",
            error
          );


          formMessage.textContent =
            "Ndodhi një gabim gjatë dërgimit.";


          sendButton.disabled = false;

          sendButton.textContent =
            "Dërgo pyetjen";

        }

      }
    );


    /* =====================================
       LOGOUT
    ===================================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        logoutButton.disabled = true;


        const result =
          await client.auth.signOut();


        if (result.error) {

          console.error(
            "LOGOUT ERROR:",
            result.error
          );


          logoutButton.disabled = false;

          return;
        }


        window.location.href =
          "index.html";

      }
    );


    /* =====================================
       START
    ===================================== */

    loadUser();

  </script>

</body>
</html>
